name: refresh-data
on:
  schedule:
    - cron: "17 4 * * 1"   # weekly, Monday 04:17 UTC (ElCom publishes new tariffs yearly, early September)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python fetch.py
      - run: python build.py
      - name: Commit if changed
        run: |
          git config user.name "Neonwisp34"
          git config user.email "Neonwisp34@users.noreply.github.com"
          git add -A docs
          if git diff --cached --quiet; then echo "no change"; else git commit -m "Auto-refresh data" && git push; fi

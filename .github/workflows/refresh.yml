name: refresh-data
on:
  schedule:
    - cron: "30 12 * * *"   # daily 12:30 UTC: day-ahead spot prices for tomorrow are out by then (13:00 CET / 14:00 CEST publication); ElCom tariffs only change yearly, the fetch is cheap
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python fetch.py
      - run: python fetch_spot.py
      - run: python build.py
      - name: Commit if changed
        run: |
          git config user.name "Neonwisp34"
          git config user.email "Neonwisp34@users.noreply.github.com"
          git add -A docs
          if git diff --cached --quiet; then echo "no change"; else git commit -m "Auto-refresh data" && git push; fi
